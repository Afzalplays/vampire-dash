name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://vampire:ci-password@localhost:5432/vampiredash
      SESSION_SECRET: ci-only-session-secret-at-least-32-characters
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run db:generate
      - run: npm run build:api
      - run: npm run build
  node-agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - run: go test ./...
        working-directory: apps/node-agent
      - run: go vet ./...
        working-directory: apps/node-agent
      - run: go build ./...
        working-directory: apps/node-agent
