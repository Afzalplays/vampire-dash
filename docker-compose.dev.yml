services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: vampiredash
      POSTGRES_USER: vampire
      POSTGRES_PASSWORD: change-this-local-password
    ports: ["5432:5432"]
    volumes: ["vampire_pg:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vampire -d vampiredash"]
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports: ["6379:6379"]
    volumes: ["vampire_redis:/data"]
volumes:
  vampire_pg:
  vampire_redis:
